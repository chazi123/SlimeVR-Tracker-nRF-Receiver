# Board-specific configuration for the holyiot 21017 dongle.
#
# This dongle carries a Skyworks SKY66112-11 front-end module (PA + LNA).
# It is described in boards/holyiot/holyiot_21017/holyiot_21017.dts:
#
#   nrf_radio_fem: skyFem {
#       compatible = "skyworks,sky66112-11", "generic-fem-two-ctrl-pins";
#       ctx-gpios = <&gpio0 24 GPIO_ACTIVE_HIGH>;   /* TX enable */
#       crx-gpios = <&gpio0 22 GPIO_ACTIVE_HIGH>;   /* RX enable */
#       tx-gain-db = <22>;
#       rx-gain-db = <12>;
#   };
#   &radio { fem = <&nrf_radio_fem>; };
#
# Without the options below the chip stays inactive and the dongle runs like a
# bare nRF52840 (no +22 dB TX, no +12 dB LNA), which is why the link is weak.
#
# ESB drives the RADIO peripheral directly instead of going through the MPSL
# scheduler, so the "FEM-only" flavour of the MPSL front-end driver is used:
# MPSL is initialized only to toggle the FEM pins, it does not schedule radio
# activity itself.
#
# NOTE: this is experimental - the upstream project has never enabled a FEM on
# any board. Verify on hardware, and keep the original firmware to flash back.

CONFIG_MPSL=y
CONFIG_MPSL_FEM_ONLY=y

# Pick the driver explicitly: the "simple GPIO" one drives the CTX/CRX pins of
# a two-control-pin FEM such as the SKY66112-11. It is only selectable once the
# devicetree node advertises the "radio-fem-two-ctrl-pins" compatible.
CONFIG_MPSL_FEM=y
CONFIG_MPSL_FEM_SIMPLE_GPIO=y

# The dongle is flashed through a UF2 bootloader (the firmware that came with it
# is a .uf2 whose blocks start at 0x1000), so emit UF2 and link the app at the
# same offset the existing firmware uses.
CONFIG_BUILD_OUTPUT_UF2=y
CONFIG_FLASH_LOAD_OFFSET=0x1000
